# Propuesta de despliegue para revisar en una cuenta propia de Render.
# El servicio starter y su disco persistente pueden generar cargos.
# Este archivo no crea recursos hasta que el titular confirme el despliegue.
services:
  - type: web
    name: laboratorio-medidas-demo
    runtime: python
    branch: demo-web
    plan: starter
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: python3 -m compileall -q APLICACION_ACTUAL
    startCommand: python3 -u APLICACION_ACTUAL/web_demo.py
    healthCheckPath: /healthz
    disk:
      name: laboratorio-demo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LAB_DATA_DIR
        value: /var/data/laboratorio-demo
      - key: LAB_ADMIN_PASSWORD
        generateValue: true
