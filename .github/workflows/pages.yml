name: Construir demo gratuita
on:
  push:
    branches: [demo-web]
    paths:
      - '.github/workflows/pages.yml'
      - 'APLICACION_ACTUAL/**'
      - 'browser-demo/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: construir-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Pruebas ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.15'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lector independiente para comprobar archivos Excel
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 et-xmlfile==2.0.0
      - name: HTTP, migraciones, permisos y red local
        run: python tests/run_ci.py http
      - name: Dominio, calidad, comparativas y documentos
        run: python tests/run_ci.py domain
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json
      - run: npm ci
        working-directory: browser-demo
      - run: npm run build
        working-directory: browser-demo
      - name: Verificar distribución
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/.nojekyll
          test -f dist/github-pages/runtime/pyodide.asm.wasm
          database_file="$(find dist/github-pages -type f \( -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' \) -print -quit)"
          test -z "$database_file"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-github-pages
          path: dist/github-pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/github-pages
          retention-days: 1
      - name: Consultar el modo de publicación configurado
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            const mode = result.data.build_type;
            if (!['legacy', 'workflow'].includes(mode)) throw new Error('Modo de GitHub Pages no reconocido.');
            core.setOutput('mode', mode);
            core.info(mode === 'workflow' ? 'Pages publica mediante Actions.' : 'Pages publica la distribución de su rama configurada.');
  deploy:
    if: needs.build.outputs.pages_mode == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
